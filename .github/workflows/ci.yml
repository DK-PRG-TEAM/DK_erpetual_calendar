# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
#
# Repaired by repocurator (feature 002), replacing .github/workflows/cmake.yml:
#   - that workflow triggered on `on: [push]` with no branch filter and no
#     `pull_request` trigger at all; this repository's default branch is
#     `dev`, so push/pull_request are now both restricted to it.
#   - its only test step was `ctest -C $BUILD_TYPE`, but no CMakeLists.txt in
#     this repository ever calls `enable_testing()`/`add_test()` -- there is
#     no test for ctest to run, which is consistent with the last recorded
#     run on `dev` (workflow "CMake") having concluded `failure`. That step
#     is replaced below with a real, assertion-based smoke test.
#   - the workflow was named `cmake.yml`; the README's CI badge (from the
#     starter template) points at `actions/workflows/ci.yml`, so the repaired
#     workflow is renamed to `ci.yml` to match it.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build

      - name: Test
        run: g++ -std=c++20 -o build/smoke_test tests/smoke_test.cpp && ./build/smoke_test
